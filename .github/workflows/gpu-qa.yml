# Runs the QA suite on a real GPU.
#
# Lint stays in ci.yml on every push on an ordinary runner; this is the
# expensive job and it is deliberately not on every push. See the "Triggers"
# comment on the job below.
name: GPU QA

on:
  push:
    # Both of the "main"-ish branches. cascade/main is the repo default;
    # cascade/main-gr-3.10.13 is where development actually happens and is
    # currently a strict descendant of it.
    branches: [cascade/main, cascade/main-gr-3.10.13]
  pull_request:
    # `unlabeled` is here so that removing the label stops a running job. The
    # route is indirect: the event creates a workflow run, that run joins the
    # concurrency group below and cancels the in-flight one, and then its own
    # job is skipped by the `if` because the label is gone. The cost is that
    # removing *any* label cancels a running job, not just this one; that is
    # recoverable by re-adding the label, and worth it for having an in-band
    # way to stop billing that is not the Cancel button in the Actions tab.
    types: [labeled, unlabeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Superseded runs are cancelled: GPU minutes are billed to the org at
  # $0.052/min, so leaving an obsolete run to finish costs real money.
  group: gpu-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # gnuradio main, pinned rather than tracking the branch head so that a red run
  # means gr-cuda changed and not gnuradio. Bumping this is a deliberate PR, and
  # it invalidates the environment cache below.
  #
  # This commit is the one the QA suite was characterised at: 61 passing, 1
  # skipped, and the two hangs contained at the bottom of this file.
  GNURADIO_REF: aee9fd3f79389c4282a98e8d62c8405c73fd91df

  # Conda's own miniforge lives in /opt and is not owned by the runner user, so
  # both the environment and the package cache have to go somewhere writable --
  # mamba fails with "cannot set permissions" on /opt/miniforge/pkgs otherwise.
  # ENV_PATH is outside the workspace on purpose: checkout must not be able to
  # clobber a restored cache. /home/runner is fixed on GitHub-hosted Linux
  # runners, and keeping both on it means conda can hardlink packages into the
  # environment rather than copying them.
  ENV_PATH: /home/runner/gr-cuda-env
  CONDA_PKGS_DIRS: /home/runner/conda-pkgs

  # Bump to invalidate every cache entry without touching environment.yml.
  CACHE_VERSION: v1

jobs:
  qa:
    # Triggers. gr-cuda is public and GPU minutes are billed to the org, so the
    # `run-gpu-qa` label is what stops a stranger's PR from spending them.
    #
    # This tests for the label being *present* rather than for the `labeled`
    # event, which is the difference between a label that gates the job for the
    # life of the PR and a label that fires exactly once. Pushing a fix to a
    # labelled PR re-runs it; removing the label stops that.
    #
    # `pull_request`, never `pull_request_target`: fork code must not get a
    # token. Fork PRs cannot write to this repo's cache, but they can read the
    # entry cascade/main wrote, so an outside contributor still gets a warm
    # start.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-gpu-qa')

    # gpu-t4 is a GitHub-hosted larger runner, not a self-hosted machine --
    # `runs-on: <custom label>` looks like the latter but the runner group is
    # provisioned by GitHub's Hosted Compute Agent and the VM is ephemeral, one
    # per job, destroyed afterwards. So running a fork's code here leaves
    # nothing behind for the next job to pick up, and there is no host to
    # re-image. What a labelled fork PR does cost is GPU minutes, which is what
    # the label gate above is for, bounded by the timeout below.
    runs-on: gpu-t4
    # Cold, the gnuradio build is the better part of an hour on 4 vCPU. Warm,
    # this should be about 15 minutes. The ceiling is a backstop against a
    # runaway job billing until someone notices, not a target.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Cheap, and it is the first thing to look at when a CUDA test fails with
      # all-zero output rather than an error: that is what both a
      # toolkit-newer-than-driver mismatch and a wrong -DCMAKE_CUDA_ARCHITECTURES
      # look like, because the kernel launches are unchecked.
      - name: GPU
        run: nvidia-smi

      # The workflow file is part of the key, not just environment.yml and the
      # gnuradio commit, because the cached artifact is gnuradio *as configured
      # by the step below*. Keying only on the commit means changing a
      # -DENABLE_* flag silently reuses an environment built with the old flags,
      # and keeps doing so until the entry evicts -- at which point CI's
      # behaviour changes on its own with no commit to blame. Hashing the whole
      # file is conservative: editing a comment here costs one cold rebuild.
      - name: Cache key
        id: key
        run: |
          echo "value=gpu-qa-${CACHE_VERSION}-${{ hashFiles('environment.yml', '.github/workflows/gpu-qa.yml') }}-${GNURADIO_REF}" >> "$GITHUB_OUTPUT"

      - name: Restore conda environment
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.ENV_PATH }}
          key: ${{ steps.key.outputs.value }}

      - name: Create conda environment
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          source /opt/miniforge/etc/profile.d/conda.sh
          mamba env create -f environment.yml -p "$ENV_PATH"

          # conda-forge's gnuradio was installed for its dependency closure
          # only; see environment.yml. --no-prune-deps unlinks gnuradio while
          # orphaning rather than garbage-collecting boost, fftw, volk and the
          # rest, which the source build below needs to find. Leaving gnuradio
          # installed is not an option: its 3.10 CMake config and libraries
          # shadow the source-built 3.11 at configure and at import time, and
          # that surfaces as a baffling test error rather than a build error.
          pkgs="$(mamba list -p "$ENV_PATH" | awk '$1 ~ /^gnuradio/ {print $1}')"
          if [ -n "$pkgs" ]; then
            # shellcheck disable=SC2086
            mamba remove -p "$ENV_PATH" -y --no-prune-deps $pkgs
          fi

      - name: Build gnuradio
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          source /opt/miniforge/etc/profile.d/conda.sh
          conda activate "$ENV_PATH"

          src="$RUNNER_TEMP/gnuradio"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/gnuradio/gnuradio.git
          git -C "$src" fetch -q --depth 1 origin "$GNURADIO_REF"
          git -C "$src" checkout -q FETCH_HEAD

          # gr-cuda links exactly one gnuradio target (gnuradio-runtime, see
          # lib/CMakeLists.txt) and the QA suite imports only gr, blocks, fft
          # and gr_unittest. Everything switched off below is a GUI, hardware or
          # docs component that gr-cuda neither links nor imports. QTGUI is the
          # one that matters twice over: it is the largest component, and it is
          # the one that fails on a headless runner.
          #
          # ENABLE_TESTING is deliberately NOT switched off, though it would be
          # faster. gnuradio templates its build-time value into the installed
          # GnuradioConfig.cmake, which only requests Boost's
          # unit_test_framework component when testing is on. With it off, every
          # downstream OOT calling GR_ADD_CPP_TEST fails to configure:
          #
          #   Target "cuda_qa_seq.cc" links to: Boost::unit_test_framework
          #   but the target was not found.
          #
          # gnuradio's own tests still never run here; they are only built.
          cmake -S "$src" -B "$src/build" -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DENABLE_DOXYGEN=OFF \
            -DENABLE_GR_QTGUI=OFF \
            -DENABLE_GR_UHD=OFF \
            -DENABLE_GR_AUDIO=OFF \
            -DENABLE_GR_VIDEO_SDL=OFF \
            -DENABLE_GR_SOAPY=OFF \
            -DENABLE_GR_IIO=OFF
          cmake --build "$src/build" -j "$(nproc)"

          # No `ninja test` here on purpose. This job tests gr-cuda; gnuradio's
          # own suite is not ours to police, and it does not pass headless.
          cmake --install "$src/build"
          rm -rf "$src"

      # Saved here rather than at job end, and this ordering is load-bearing.
      # The plain actions/cache action saves in a post-job step, by which point
      # gr-cuda has been installed into this same prefix -- so every run would
      # store an environment carrying the previous commit's gr-cuda and restore
      # it over the next one. gr-cuda is fast to build and changes every PR; it
      # stays outside the cache deliberately.
      - name: Save conda environment
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.ENV_PATH }}
          key: ${{ steps.key.outputs.value }}

      # actions/cache is capped at 10 GB per repository and evicts least
      # recently used entries. If this creeps toward the cap, the fix is to move
      # the prebuilt environment to a container image in GHCR.
      - name: Environment size
        run: |
          echo "cache hit: ${{ steps.cache.outputs.cache-hit || 'false' }}"
          du -sh "$ENV_PATH"

      - name: Build gr-cuda
        run: |
          source /opt/miniforge/etc/profile.d/conda.sh
          conda activate "$ENV_PATH"
          # CMAKE_CUDA_ARCHITECTURES=native resolves against the card actually
          # present, which is a T4 (sm_75) here and a Blackwell (sm_120) on
          # europa. This job therefore proves logic, not Blackwell codegen.
          # ENABLE_IBV is pinned rather than left to its default, which is
          # `find_library(ibverbs)` -- i.e. a function of whatever the runner
          # image happens to ship. Today that resolves to OFF; if a future image
          # adds rdma-core it would silently flip ON and start compiling blocks
          # this runner has no NIC to exercise. Off explicitly means CI's
          # compiled surface changes only when someone changes this file.
          cmake -S . -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX" \
            -DCMAKE_PREFIX_PATH="$CONDA_PREFIX" \
            -DCMAKE_CUDA_ARCHITECTURES=native \
            -DENABLE_IBV=OFF
          cmake --build build -j "$(nproc)"
          cmake --install build

      # QA runs from a copy of the files, which is not fussiness -- it is the fix
      # for a collection failure that takes out every file at once.
      #
      # python/cuda is a package directory named `cuda`. With its __init__.py
      # present, pytest names the test modules cuda.qa_* and imports the parent
      # package, so `cuda` binds to gr-cuda's source tree. cupy then does
      # `from cuda import pathfinder`, gets gr-cuda instead of NVIDIA's package,
      # and every file errors during collection:
      #
      #   ImportError: cannot import name 'pathfinder' from 'cuda'
      #     (.../python/cuda/__init__.py)
      #
      # --import-mode=importlib does not avoid this; the module naming is what
      # causes it. Copying the files flat, without __init__.py, leaves no `cuda`
      # package for anything to resolve to. The sibling modules are copied
      # alongside because five files (qa_add_cupy, qa_fanin_sync,
      # qa_multiply_const_cupy, qa_parallel_sync, qa_stress_sync) catch the
      # failing relative import and retry it as a bare-name import, which is
      # the path taken here.
      #
      # This still tests what was just built: the files import gr-cuda as
      # `from gnuradio import cuda`, which is the copy installed into the conda
      # prefix, not the source tree they were copied from.
      - name: Stage QA files
        run: |
          mkdir -p "$RUNNER_TEMP/qa"
          cp python/cuda/*.py "$RUNNER_TEMP/qa/"
          rm -f "$RUNNER_TEMP/qa/__init__.py"
          # Carried along so CI and developers run under identical pytest
          # settings, the global timeout included.
          cp pyproject.toml "$RUNNER_TEMP/qa/"
          ls "$RUNNER_TEMP/qa"

      - name: QA
        id: qa
        working-directory: ${{ runner.temp }}/qa
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /opt/miniforge/etc/profile.d/conda.sh
          conda activate "$ENV_PATH"
          # The two deselected tests hang on europa but pass here in under three
          # seconds; see the next step for why they stay out of the gating run
          # anyway. Everything else gates the job.
          pytest . \
            --deselect qa_cuda_block.py::qa_cuda_block::test_009_sync_history \
            --deselect qa_fft.py::qa_fft::test_cuda_fft_shift

      # Two tests hang on europa's Blackwell under this same gnuradio commit.
      # They do not hang here: on the T4 they pass in under three seconds, with
      # byte-identical test files. That is evidence the cause is timing- or
      # hardware-dependent rather than a logic error -- 4 vCPU behind PCIe 3
      # samples a very different interleaving than 32 cores behind PCIe 5.
      #
      # They stay deselected from the gating run rather than being promoted into
      # it. A test that deadlocks on the machine the team actually develops on
      # is not one to gate on the strength of it passing somewhere else, and
      # these are race tests, so passing once is not passing. Running them here
      # reports the result every time and the per-test timeout means that if
      # they ever do hang on this runner it costs 120 seconds, not the job's
      # 90-minute ceiling. Worth revisiting once the europa behaviour is
      # understood.
      #
      # The condition runs this even when the gating step failed, because it is
      # diagnostic information and it is most wanted on the runs that went
      # wrong. It is skipped only when QA never ran at all, which means the
      # build failed and there is nothing to say.
      - name: Known hangs (informational, does not gate)
        if: ${{ !cancelled() && steps.qa.conclusion != 'skipped' }}
        continue-on-error: true
        working-directory: ${{ runner.temp }}/qa
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          source /opt/miniforge/etc/profile.d/conda.sh
          conda activate "$ENV_PATH"
          pytest --timeout=120 \
            qa_cuda_block.py::qa_cuda_block::test_009_sync_history \
            qa_fft.py::qa_fft::test_cuda_fft_shift
