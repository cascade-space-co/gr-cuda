[tool.pytest.ini_options]
testpaths = ["python/cuda"]
python_files = "test_*.py qa_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]

# No pytest-timeout settings here on purpose: --strict-config above makes an
# unrecognised ini key an error, so `timeout` would break pytest for anyone
# without the plugin. CI passes it on the command line.
#
# Plain `pytest` from the repo root does not work -- python/cuda shadows
# NVIDIA's `cuda` package. Run a file directly, or see docs/CI.md.

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Exclude auto-generated files and build artifacts
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
    ".tox",
    ".venv",
    "venv",
    "bindings",
    "*.pyc",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "I001"]  # Allow unused imports and manual import order
"test_*.py" = ["F401", "F403", "F811"]  # Allow test-specific patterns
"qa_*.py" = ["F401", "F403", "F811"]  # Allow QA test patterns

[tool.coverage.run]
source = ["python"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 80
