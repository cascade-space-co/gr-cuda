[tool.pytest.ini_options]
testpaths = ["python/cuda"]
python_files = "test_*.py qa_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]

# No pytest-timeout settings here on purpose, though CI relies on them. They are
# passed on the command line in .github/workflows/gpu-qa.yml instead, because
# `timeout` and `timeout_method` are only recognised when the plugin is
# installed, and --strict-config above turns an unrecognised ini key into an
# error rather than a warning. Putting them here would break `pytest` outright
# for anyone whose environment predates this file -- which, as of writing, is
# every environment on europa.
#
# Note also that running `pytest` from the repository root does not currently
# work: python/cuda is a package directory named `cuda`, so pytest imports the
# suite as the `cuda` package and shadows NVIDIA's, which breaks cupy at
# collection. CI works around it by running the files from a flat copy; see the
# "Stage QA files" step in the workflow. Running an individual file directly
# (`python python/cuda/qa_fft.py`) is unaffected.

[tool.ruff]
target-version = "py312"
line-length = 88
lint.select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Exclude auto-generated files and build artifacts
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg",
    ".tox",
    ".venv",
    "venv",
    "bindings",
    "*.pyc",
    ".pytest_cache",
    ".ruff_cache",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "I001"]  # Allow unused imports and manual import order
"test_*.py" = ["F401", "F403", "F811"]  # Allow test-specific patterns
"qa_*.py" = ["F401", "F403", "F811"]  # Allow QA test patterns

[tool.coverage.run]
source = ["python"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
show_missing = true
fail_under = 80
