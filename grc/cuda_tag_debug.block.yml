id: cuda_tag_debug
label: Tag Debug (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: |-
      cuda.tag_debug(${type.size}*${vlen}, ${name}, ${filter}, ${num_inputs})
      self.${id}.set_display(${display})
  callbacks:
  - set_display(${display})

parameters:
- id: type
  label: Input Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: name
  label: Name
  dtype: string
- id: filter
  label: Key Filter
  dtype: string
  default: '""'
- id: num_inputs
  label: Num Inputs
  dtype: int
  default: '1'
  hide: part
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: display
  label: Display
  dtype: bool
  default: 'True'
  options: ['True', 'False']
  option_labels: ['On', 'Off']

inputs:
- label: in
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}
  multiplicity: ${num_inputs}

asserts:
- ${ num_inputs >= 1 }
- ${ vlen > 0 }

documentation: |-
    Prints or stores the stream tags of GPU streams, like Tag Debug.
    Tags are host-side metadata, so the samples are never read and no
    device-to-host copy is made.

file_format: 1
