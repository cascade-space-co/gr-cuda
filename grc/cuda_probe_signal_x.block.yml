id: cuda_probe_signal_x
label: Probe Signal (CUDA)
flags: [ show_id ]
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.probe_signal_${type.fcn}()

parameters:
- id: type
  label: Input Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    fcn: [c, f, i, s, b]
  hide: part

inputs:
- label: in
  domain: cuda
  dtype: ${type}

documentation: |-
    Keeps the last sample of a GPU stream for reading from Python, like
    Probe Signal.  Only that sample is copied to the host.

    Available functions to probe: level()

    Use with the function probe block.

file_format: 1
