id: cuda_ibv_source
label: IBV Source (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.ibv_source(${ibv_device}, ${udp_port}, ${payload_size}, ${mcast_group})

parameters:
- id: ibv_device
  label: IB Device
  dtype: string
  default: ''
- id: udp_port
  label: UDP Port
  dtype: int
  default: '5000'
- id: payload_size
  label: Payload Size (bytes)
  dtype: int
  default: '8000'
- id: mcast_group
  label: Multicast Group
  dtype: string
  default: ''
  hide: ${ 'part' if not mcast_group else 'none' }
outputs:
- label: out
  domain: cuda
  dtype: byte
  vlen: ${payload_size}

file_format: 1
