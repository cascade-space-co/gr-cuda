id: cuda_load
label: Load (CUDA)
category: "[CUDA]"
templates:
  imports: from gnuradio import cuda
  make: cuda.load(${iterations}, ${type.size}*${vlen}, ${use_cb})
parameters:
  - id: type
    label: Type
    dtype: enum
    options: [complex, float, int, short, byte, sc16, sc8]
    option_labels: [complex, float, int, short, byte, complex int16, complex int8]
    option_attributes:
      size:
        [
          gr.sizeof_gr_complex,
          gr.sizeof_float,
          gr.sizeof_int,
          gr.sizeof_short,
          gr.sizeof_char,
          2*gr.sizeof_short,
          2*gr.sizeof_char,
        ]
    hide: part
  - id: vlen
    label: Vector Length
    dtype: int
    default: "1"
    hide: ${ 'part' if vlen == 1 else 'none' }
  - id: iterations
    label: Iterations
    dtype: int
    default: 100
  - id: use_cb
    label: Use Custom Buffers
    dtype: bool
    default: True

inputs:
  - label: in
    domain: cuda
    dtype: ${type}
    vlen: ${vlen}
outputs:
  - label: out
    domain: cuda
    dtype: ${type}
    vlen: ${vlen}
file_format: 1
