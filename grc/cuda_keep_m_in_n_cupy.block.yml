id: cuda_keep_m_in_n_cupy
label: Keep M in N (CuPy)
category: '[CUDA]/Stream Operators'
flags: [ python ]

templates:
    imports: |-
        import numpy as np
        from gnuradio import cuda
    make: |-
        cuda.keep_m_in_n_cupy(
            m=${m},
            n=${n},
            offset=${offset},
            vlen=${vlen},
            dtype=${type.np_dtype},
            output_multiple=${output_multiple})
    callbacks:
    - set_offset(${offset})
    - set_m(${m})
    - set_n(${n})

parameters:
-   id: type
    label: IO Type
    dtype: enum
    default: complex
    options: [complex, float, int, short, byte]
    option_attributes:
        np_dtype: [np.complex64, np.float32, np.int32, np.int16, np.uint8]
    hide: part
-   id: m
    label: M
    dtype: int
    default: '1'
-   id: n
    label: N
    dtype: int
    default: '2'
-   id: offset
    label: Initial Offset
    dtype: int
    default: '0'
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

outputs:
-   label: out
    domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ n > 0 }
- ${ m > 0 }
- ${ m <= n }
- ${ offset >= 0 }
- ${ offset < n }
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    GPU equivalent of Keep M in N, operating on CUDA buffers.

    From each block of N input items, outputs the M items starting at Initial
    Offset. If Initial Offset + M is greater than N, the selection wraps to the
    start of the same block; kept items always stay in their original order.
    Example: M = 2, N = 5, Initial Offset = 4 keeps items 0 and 4 of each block.

    With Vector Length > 1, M and N count whole vectors.

    M, N and Initial Offset can be changed at runtime. A change that would
    break 1 <= M <= N or 0 <= Initial Offset < N is rejected with an error.
    Tags are moved to output offsets scaled by M / N.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. It is combined with M (least
    common multiple), since output always comes in whole groups of M. As with
    any GNU Radio block, the end of a finite stream that does not fill a whole
    batch may be dropped.

file_format: 1
