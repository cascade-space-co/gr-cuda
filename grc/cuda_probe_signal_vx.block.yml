id: cuda_probe_signal_vx
label: Probe Signal Vector (CUDA)
flags: [ show_id ]
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.probe_signal_v${type.fcn}(${vlen})

parameters:
- id: type
  label: Input Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    fcn: [c, f, i, s, b]
  hide: part
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }

inputs:
- label: in
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}

asserts:
- ${ vlen > 0 }

documentation: |-
    Keeps the last vector of a GPU stream for reading from Python, like
    Probe Signal Vector.  Only that vector is copied to the host.

    Available functions to probe: level()

    Use with the function probe block.

file_format: 1
