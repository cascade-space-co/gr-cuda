id: cuda_null_source
label: Null Source (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: |-
      cuda.null_source(${type.size}*${vlen}, ${num_outputs}, ${memset})
      % if output_multiple() != 1:
      self.${id}.set_output_multiple(${output_multiple})
      % endif

parameters:
- id: type
  label: Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: num_outputs
  label: Num Outputs
  dtype: int
  default: '1'
  hide: ${ 'part' if num_outputs == 1 else 'none' }
- id: memset
  label: Zero Fill
  dtype: enum
  default: 'True'
  options: ['True', 'False']
  option_labels: ['Yes', 'No']
  hide: part
- id: output_multiple
  label: Output Multiple
  dtype: int
  default: '1'
  category: Advanced
  hide: part

outputs:
- label: out
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}
  multiplicity: ${num_outputs}

asserts:
- ${ output_multiple > 0 }

documentation: |-
    A source of zeros in GPU memory, used mainly for testing and benchmarking
    CUDA blocks without host-to-device transfers.

    Zero Fill: if Yes, every output is cleared with cudaMemsetAsync on every
    call. If No, the outputs are left untouched and contain whatever was in
    the buffer. This avoids spending GPU memory bandwidth on the memset, which
    can otherwise skew benchmarks of downstream blocks.

file_format: 1
