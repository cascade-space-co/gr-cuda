id: cuda_null_source
label: Null Source (GPU)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.null_source(${type.size}*${vlen}, ${num_outputs})

parameters:
- id: type
  label: Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: num_outputs
  label: Num Outputs
  dtype: int
  default: '1'
  hide: ${ 'part' if num_outputs == 1 else 'none' }

outputs:
- label: out
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}
  multiplicity: ${num_outputs}

file_format: 1


