id: cuda_tee_host
label: Tee (Host)
category: '[CUDA]'

parameters:
-   id: type
    label: IO Type
    dtype: enum
    options: [complex, float, int, short, byte]
    option_attributes:
        size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
    hide: part
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }

asserts:
- ${ vlen > 0 }

inputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }

outputs:
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }
-   domain: stream
    dtype: ${ type }
    vlen: ${ vlen }

templates:
    imports: |-
        from gnuradio import cuda
    make: cuda.tee(${type.size}*${vlen}, gpu=False)

documentation: |-
    Accepts one host-domain input and produces two identical host-domain
    outputs via explicit memory copy.

    GNU Radio does not support mixed fan-out: a single output port cannot
    feed downstream blocks that use different buffer types (e.g. GPU and CPU)
    because all readers share one buffer with one transfer type. This block
    works around that limitation by copying the input into two separate output
    buffers, each with its own port. Downstream blocks connect to whichever
    port they need, and GNU Radio's buffer negotiation handles any cross-domain
    (H2D / D2H) transfers at the boundaries automatically.

    All ports use default host buffers; copies are performed with memcpy.

file_format: 1
