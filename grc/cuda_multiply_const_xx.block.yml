id: cuda_multiply_const_xx
label: Multiply Const (CUDA)
flags: [ python, cpp ]
category: '[CUDA]'

parameters:
-   id: type
    label: IO Type
    dtype: enum
    options: [complex, float, int, short]
    option_attributes:
        fcn: [cc, ff, ii, ss]
        const_type: [complex, float, int, int]
    hide: part
-   id: const
    label: Constant
    dtype: ${ type.const_type }
    default: '0'
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

outputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.multiply_const_${type.fcn}(${const}, ${vlen})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_k(${const})

cpp_templates:
    includes: ['#include <gnuradio/multiply_const.h>']
    declarations: 'cuda::multiply_const_${type.fcn}::sptr ${id};'
    make: |-
        this->${id} = cuda::multiply_const_${type.fcn}::make(${const}, ${vlen});
        % if output_multiple() != 1:
        this->${id}->set_output_multiple(${output_multiple});
        % endif
    callbacks:
    - set_k(${const})

file_format: 1
