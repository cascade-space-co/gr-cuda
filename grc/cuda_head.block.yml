id: cuda_head
label: Head (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: |-
      cuda.head(${type.size}*${vlen}, ${num_items})
      % if output_multiple() != 1:
      self.${id}.set_output_multiple(${output_multiple})
      % endif
  callbacks:
  - set_length(${num_items})

parameters:
- id: type
  label: Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: num_items
  label: Num Items
  dtype: int
  default: '1024'
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: output_multiple
  label: Output Multiple
  dtype: int
  default: '1'
  category: Advanced
  hide: part

inputs:
- label: in
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}

outputs:
- label: out
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}
  optional: true

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    Passes the first Num Items items of a GPU stream, then stops the
    flowgraph, like Head.  Items are copied on the GPU.  With the output
    unconnected, the block consumes the items without reading them.

file_format: 1
