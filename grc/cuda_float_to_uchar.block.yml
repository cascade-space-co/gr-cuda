id: cuda_float_to_uchar
label: Float To UChar (CUDA)
category: '[CUDA]/Type Converters'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.float_to_uchar(${vlen}, ${scale}, ${bias})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_scale(${scale})
    - set_bias(${bias})

parameters:
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: scale
    label: Scale
    dtype: real
    default: '1'
-   id: bias
    label: Bias
    dtype: real
    default: '0'
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: float
    vlen: ${ vlen }

outputs:
-   label: out
    domain: cuda
    dtype: byte
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    Converts floats to unsigned chars on the GPU: out = in * Scale + Bias,
    rounded to the nearest integer (ties to even) and saturated to 0..255.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
