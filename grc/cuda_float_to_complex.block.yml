id: cuda_float_to_complex
label: Float To Complex (CUDA)
category: '[CUDA]/Type Converters'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.float_to_complex(${vlen})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif

parameters:
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: re
    domain: cuda
    dtype: float
    vlen: ${ vlen }
-   label: im
    domain: cuda
    dtype: float
    vlen: ${ vlen }
    optional: true

outputs:
-   label: out
    domain: cuda
    dtype: complex
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    Combines real and imaginary floats into complex on the GPU. If the im input
    is not connected, the imaginary part is zero.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
