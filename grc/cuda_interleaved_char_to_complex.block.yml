id: cuda_interleaved_char_to_complex
label: IChar To Complex (CUDA)
category: '[CUDA]/Type Converters'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.interleaved_char_to_complex(True, ${scale_factor}, ${swap}, ${vlen})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_scale_factor(${scale_factor})
    - set_swap(${swap})

parameters:
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: scale_factor
    label: Scale Factor
    dtype: real
    default: '1.0'
-   id: swap
    label: Swap
    dtype: enum
    default: 'False'
    options: ['False', 'True']
    option_labels: ['No', 'Yes']
    hide: part
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: sc8
    vlen: ${ vlen }

outputs:
-   label: out
    domain: cuda
    dtype: complex
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    Converts interleaved I/Q chars (sc8) to complex on the GPU:
    out = (I + jQ) / Scale Factor. For full-scale input use 127. With Swap,
    the first char of each pair is Q.

    Unlike IChar To Complex, supports Swap and Vector Length, for example one
    element per channel of a multichannel sc8 source.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
