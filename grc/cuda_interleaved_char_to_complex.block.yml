id: cuda_interleaved_char_to_complex
label: IChar To Complex (CUDA)
category: '[CUDA]/Type Converters'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.interleaved_char_to_complex(${vector_input}, ${scale_factor}, ${swap})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_scale_factor(${scale_factor})
    - set_swap(${swap})

parameters:
-   id: scale_factor
    label: Scale Factor
    dtype: real
    default: '1.0'
-   id: vector_input
    label: Vector Input
    dtype: enum
    default: 'False'
    options: ['False', 'True']
    option_labels: ['No', 'Yes']
    option_attributes:
        vlen: [1, 2]
-   id: swap
    label: Swap
    dtype: enum
    default: 'False'
    options: ['False', 'True']
    option_labels: ['No', 'Yes']
    hide: part
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: byte
    vlen: ${ vector_input.vlen }

outputs:
-   label: out
    domain: cuda
    dtype: complex

asserts:
- ${ output_multiple > 0 }

documentation: |-
    Converts interleaved I/Q chars to complex on the GPU:
    out = (I + jQ) / Scale Factor. For full-scale input use 127.

    With Vector Input, each complex comes from one vector of two chars. With
    Swap, the first char of each pair is Q.

    Unlike IChar To Complex, supports Swap.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
