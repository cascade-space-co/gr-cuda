id: cuda_multiply_const_cupy
label: Multiply Const (CuPy)
flags: [ python ]
category: '[CUDA]'

parameters:
-   id: type
    label: IO Type
    dtype: enum
    options: [complex, float, int, short]
    option_attributes:
        np_dtype: [np.complex64, np.float32, np.int32, np.int16]
    hide: part
-   id: const
    label: Constant
    dtype: ${ type }
    default: '0'
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

outputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

templates:
    imports: |-
        from gnuradio import cuda
        import numpy as np
    make: |-
        cuda.multiply_const_cupy(${const}, dtype=${type.np_dtype}, vlen=${vlen})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_k(${const})

file_format: 1
