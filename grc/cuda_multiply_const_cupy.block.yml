id: cuda_multiply_const_cupy
label: Multiply Const (CuPy)
category: '[CUDA]'
flags: [ python ]

parameters:
-   id: type
    label: IO Type
    dtype: enum
    options: [complex, float, int, short]
    option_attributes:
        np_dtype: [complex64, float32, int32, int16]
        const_type: [complex, float, int, int]
    hide: part
-   id: const
    label: Constant
    dtype: ${ type.const_type }
    default: '0'
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'git 
    hide: ${ 'part' if vlen == 1 else 'none' }

inputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

outputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

templates:
    imports: |-
        from gnuradio import cuda
        import numpy as np
    make: cuda.multiply_const_cupy(${const}, dtype=np.dtype('${type.np_dtype}'), vlen=${vlen})
    callbacks:
    - set_k(${const})

file_format: 1

