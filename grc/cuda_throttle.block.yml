id: cuda_throttle
label: Throttle (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.throttle(${type.size}*${vlen}, ${sample_rate})
  callbacks:
  - set_sample_rate(${sample_rate})

parameters:
- id: type
  label: Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: vlen
  label: Vec Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: sample_rate
  label: Sample Rate
  dtype: float
  default: samp_rate

inputs:
- domain: cuda
  dtype: ${ type }
  vlen: ${ vlen }

outputs:
- domain: cuda
  dtype: ${ type }
  vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ sample_rate > 0 }

documentation: |-
  Limits the average throughput to the specified sample rate.

  Operates on GPU buffers without D2H transfers. The throttling is performed
  by delaying the CPU scheduler thread, which effectively limits the rate
  at which GPU kernels are launched.

  Useful for simulations or preventing the flowgraph from consuming 100% CPU/GPU
  when no hardware rate-limiting block is present.

file_format: 1
