id: cuda_probe_rate
label: Probe Rate (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.probe_rate(${type.size}*${vlen}, ${mintime}, ${alpha}, ${name})
  callbacks:
  - set_alpha(${alpha})
  - set_name(${name})

parameters:
- id: type
  label: Input Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: mintime
  label: Min Update Time (ms)
  dtype: real
  default: '500.0'
- id: alpha
  label: Update Alpha
  dtype: real
  default: '0.15'
- id: name
  label: Name
  dtype: string
  default: "''"

inputs:
- domain: cuda
  dtype: ${ type }
  vlen: ${ vlen }

outputs:
- label: rate
  domain: message
  id: rate
  optional: true

asserts:
- ${ vlen > 0 }

documentation: |-
  Measures throughput of GPU data directly on the device without D2H transfer.

  Outputs rate information via message port 'rate' as a dictionary containing:
  - rate_avg: exponentially averaged sample rate
  - rate_now: instantaneous sample rate for this update period
  - name: block name (if provided)

  Alpha controls the exponential averaging:
  - Small alpha (e.g. 0.0001): slow adaptation, smooth average
  - Large alpha (e.g. 0.1): fast adaptation, tracks changes quickly

file_format: 1
