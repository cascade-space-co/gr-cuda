id: cuda_random_uniform_source_cupy
label: Random Uniform Source (CuPy)
flags: [ python ]
category: '[CUDA]/Waveform Generators'

parameters:
-   id: type
    label: Output Type
    dtype: enum
    options: [int, short, byte]
    option_attributes:
        np_dtype: [np.int32, np.int16, np.uint8]
    hide: part
-   id: minimum
    label: Minimum
    dtype: int
    default: '0'
-   id: maximum
    label: Maximum
    dtype: int
    default: '2'
-   id: seed
    label: Seed
    dtype: int
    default: '0'
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }

outputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }

templates:
    imports: |-
        from gnuradio import cuda
        import numpy as np
    make: cuda.random_uniform_source_cupy(${minimum}, ${maximum}, ${seed}, vlen=${vlen}, dtype=${type.np_dtype})

file_format: 1
