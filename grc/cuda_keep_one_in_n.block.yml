id: cuda_keep_one_in_n
label: Keep 1 in N (CUDA)
category: '[CUDA]/Stream Operators'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.keep_one_in_n(${type.size}*${vlen}, ${n})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_n(${n})

parameters:
-   id: type
    label: IO Type
    dtype: enum
    default: complex
    options: [complex, float, int, short, byte]
    option_attributes:
        size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
    hide: part
-   id: n
    label: N
    dtype: int
    default: '1'
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

outputs:
-   label: out
    domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ n > 0 }
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    GPU equivalent of Keep 1 in N, operating on CUDA buffers.

    Outputs one item out of every N: input items N-1, 2N-1, 3N-1, and so on.
    The count carries over between work calls, so any N works, including
    values larger than the buffer.

    With Vector Length > 1, N counts whole vectors.

    N can be changed at runtime; changing it restarts the count. Each tag is
    moved to the first kept item at or after it.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
