id: cuda_complex_to_mag_cupy
label: Complex to Mag (CuPy)
flags: [ python ]
category: '[CUDA]'

parameters:
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   domain: cuda
    dtype: complex
    vlen: ${ vlen }

outputs:
-   domain: cuda
    dtype: float
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

templates:
    imports: |-
        from gnuradio import cuda
    make: |-
        cuda.complex_to_mag_cupy(vlen=${vlen})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif

file_format: 1
