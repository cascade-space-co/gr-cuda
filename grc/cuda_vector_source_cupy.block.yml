id: cuda_vector_source_cupy
label: Vector Source (CuPy)
flags: [ python ]
category: '[CUDA]/Waveform Generators'

parameters:
-   id: type
    label: Output Type
    dtype: enum
    options: [complex, float, int, short, byte]
    option_attributes:
        np_dtype: [np.complex64, np.float32, np.int32, np.int16, np.int8]
    hide: part
-   id: vector
    label: Vector
    dtype: raw
    default: (0, 0, 0)
-   id: tags
    label: Tags
    dtype: raw
    default: '[]'
-   id: repeat
    label: Repeat
    dtype: enum
    default: 'True'
    options: ['True', 'False']
    option_labels: ['Yes', 'No']
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }

outputs:
-   domain: cuda
    dtype: ${ type }
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }

templates:
    imports: |-
        from gnuradio import cuda
        import numpy as np
    make: cuda.vector_source_cupy(${vector}, ${repeat}, ${vlen}, ${tags}, dtype=${type.np_dtype})
    callbacks:
    - set_data(${vector}, ${tags})

file_format: 1
