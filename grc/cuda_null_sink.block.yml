id: cuda_null_sink
label: Null Sink (CUDA)
category: '[CUDA]'

templates:
  imports: from gnuradio import cuda
  make: cuda.null_sink(${type.size}*${vlen}, ${num_inputs})

parameters:
- id: type
  label: Type
  dtype: enum
  options: [complex, float, int, short, byte]
  option_attributes:
    size: [gr.sizeof_gr_complex, gr.sizeof_float, gr.sizeof_int, gr.sizeof_short, gr.sizeof_char]
  hide: part
- id: vlen
  label: Vector Length
  dtype: int
  default: '1'
  hide: ${ 'part' if vlen == 1 else 'none' }
- id: num_inputs
  label: Num Inputs
  dtype: int
  default: '1'
  hide: ${ 'part' if num_inputs == 1 else 'none' }

inputs:
- label: in
  domain: cuda
  dtype: ${type}
  vlen: ${vlen}
  multiplicity: ${num_inputs}

file_format: 1


