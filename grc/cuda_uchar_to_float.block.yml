id: cuda_uchar_to_float
label: UChar To Float (CUDA)
category: '[CUDA]/Type Converters'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.uchar_to_float(${vlen}, ${scale})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_scale(${scale})

parameters:
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: scale
    label: Scale
    dtype: real
    default: '1'
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: byte
    vlen: ${ vlen }

outputs:
-   label: out
    domain: cuda
    dtype: float
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    Converts uchars to floats on the GPU: out = in / Scale.

    Unlike UChar To Float, supports vectors and a scale.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
