id: cuda_complex_to_interleaved_char
label: Complex To IChar (CUDA)
category: '[CUDA]/Type Converters'
flags: [ python ]

templates:
    imports: from gnuradio import cuda
    make: |-
        cuda.complex_to_interleaved_char(True, ${scale_factor}, ${vlen})
        % if output_multiple() != 1:
        self.${id}.set_output_multiple(${output_multiple})
        % endif
    callbacks:
    - set_scale_factor(${scale_factor})

parameters:
-   id: vlen
    label: Vector Length
    dtype: int
    default: '1'
    hide: ${ 'part' if vlen == 1 else 'none' }
-   id: scale_factor
    label: Scale Factor
    dtype: real
    default: '1.0'
-   id: output_multiple
    label: Output Multiple
    dtype: int
    default: '1'
    category: Advanced
    hide: part

inputs:
-   label: in
    domain: cuda
    dtype: complex
    vlen: ${ vlen }

outputs:
-   label: out
    domain: cuda
    dtype: sc8
    vlen: ${ vlen }

asserts:
- ${ vlen > 0 }
- ${ output_multiple > 0 }

documentation: |-
    Converts complex samples to interleaved I/Q chars (sc8) on the GPU:
    out = in * Scale Factor, rounded to the nearest integer (ties to even) and
    saturated to the char range. For full-scale output use 127.

    Unlike Complex To IChar, supports Vector Length.

    Output Multiple asks the scheduler for output batches in multiples of this
    size, which can reduce per-call overhead. As with any GNU Radio block, the
    end of a finite stream that does not fill a whole batch may be dropped.

file_format: 1
