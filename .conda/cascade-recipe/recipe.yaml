context:
  version: ${{ env.get("RECIPE_VERSION") }}

package:
  name: gnuradio-cuda
  version: ${{ version }}

source:
  path: ../..
  use_gitignore: false

build:
  number: 0
  script:
    - mkdir build
    - cd build
    - |
      cmake ${CMAKE_ARGS} -G Ninja .. \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_PREFIX_PATH=$PREFIX \
        -DCMAKE_INSTALL_PREFIX=$PREFIX \
        -DLIB_SUFFIX="" \
        -DPYTHON_EXECUTABLE=$PYTHON \
        -DGR_PYTHON_DIR=$SP_DIR \
        -DENABLE_DOXYGEN=OFF \
        -DENABLE_TESTING=ON \
        -DCMAKE_CUDA_ARCHITECTURES=120
    - cmake --build . --config Release -- -j${CPU_COUNT}
    - cmake --build . --config Release --target install

requirements:
  run_exports:
    # Matches GNU Radio's own MAJOR.API.ABI.PATCH convention.
    - ${{ pin_subpackage("gnuradio-cuda", upper_bound="x.x.x") }}
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - ${{ compiler("cxx") }}
    - cuda-nvcc
    - cmake
    - ninja
    - pkg-config
    - python
  host:
    - gnuradio-core >=3.11.0.0a0
    - libboost-devel
    - cuda-cudart-dev
    - cuda-driver-dev
    - libcufft-dev
    - numpy
    - pybind11
    - pybind11-abi
    - python
  run:
    - gnuradio-core
    - python
    - cupy
    - numpy

tests:
  - script:
      - test -f "$PREFIX/lib/libgnuradio-cuda${SHLIB_EXT}"
      - test -f "$PREFIX/include/gnuradio/cuda/api.h"
      - find "$PREFIX/lib/python3.12/site-packages/gnuradio/cuda" -maxdepth 1 -iname "cuda_python*.so" | grep -q .

about:
  homepage: https://github.com/cascade-space-co/gr-cuda
  repository: https://github.com/cascade-space-co/gr-cuda
  license: GPL-3.0-or-later
  summary: GNU Radio CUDA-accelerated blocks (Cascade build)
